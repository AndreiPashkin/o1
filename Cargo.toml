[workspace]
members = ["o1_core", "o1_test", "o1_tests", "o1", "o1_derive"]
resolver = "2"

[workspace.package]
version = "0.0.1-alpha.4"
edition = "2021"

[workspace.dependencies]
o1 = { path = "o1", version = "0.0.1-alpha.4" }
o1_core = { path = "o1_core", version = "0.0.1-alpha.4" }
o1_derive = { path = "o1_derive", version = "0.0.1-alpha.4" }
o1_test = { path = "o1_test", version = "0.0.1-alpha.4" }
thiserror = "2.0"
rand = "~0.9.0"
rand_chacha = "~0.9.0"
compose-idents = "~0.2.0"

[workspace.lints.clippy]
doc_overindented_list_items = "allow"
print_stderr = "deny"
print_stdout = "deny"
